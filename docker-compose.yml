services:
  3xui:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: 3xui_app
    volumes:
    - $PWD/db/:/etc/x-ui/
    - $PWD/cert/:/root/cert/
    - $PWD/acme/:/root/.acme.sh/
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "false"
      XUI_PORT: "8080"
    tty: true
    restart: unless-stopped
    expose:
    - "8080"
    deploy:
      resources:
        limits:
          memory: '134217728'
          cpus: 0.125
        reservations: {}
    mem_limit: 134217728
    memswap_limit: 134217728
    cpus: 0.125
  postgres:
    image: postgres:16-alpine
    container_name: 3xui_postgres
    profiles:
    - "postgres"
    environment:
      POSTGRES_USER: xui
      POSTGRES_PASSWORD: xui
      POSTGRES_DB: xui
    volumes:
    - $PWD/pgdata/:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: '134217728'
          cpus: 0.125
        reservations: {}
    mem_limit: 134217728
    memswap_limit: 134217728
    cpus: 0.125
